<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Simulación de Crédito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Simulador de Crédito Personal</h1>
    <form id="credit-form">
      <label for="monto">Monto del Crédito Solicitado ($):</label>
      <input type="number" id="monto" value="150000" required>

      <label for="tasa">Tasa de Interés Anual Ordinaria (%):</label>
      <input type="number" id="tasa" value="34" step="0.1" required>

      <label for="plazo">Plazo del Financiamiento (Meses):</label>
      <select id="plazo">
        <option value="12">12 meses</option>
        <option value="24">24 meses</option>
        <option value="36">36 meses</option>
        <option value="48" selected>48 meses</option>
      </select>
    </form>
    <button id="btn-calcular">Calcular Simulación</button>
    <table id="tabla-amortizacion" border="1">
      <thead>
        <tr><th>Mes</th><th>Pago Mensual</th><th>Interés</th><th>IVA (16%)</th><th>Amortización</th><th>Saldo Insoluto</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
